        zoomIn: 'Zoom in'
        zoomOut: 'Zoom out'
        mapLabel: 'Author map'
        mapDescription: 'A three-dimensional map of authors, placed so that those who share readers sit close together, and colored by reading community. The table below carries the same information as text. Keyboard: arrow keys orbit; Shift+arrow keys pan; plus and minus zoom; 0 resets the complete map; Escape deselects.'
        aperture:
          trigger: 'Connections'
          title: 'Connection aperture'
          accessibleName: 'Connections shown'
          focused: 'Focused'
          wider: 'Wider'
          shortcuts: 'Connection shortcuts'
          ariaValue: 'Up to {{count}} relationships from the current table order'
          announcement: 'The map now follows up to {{count}} relationships in the table.'
          mapped: '{{table}} table relationships · {{mapped}} mapped'
        personal:
          show: 'Show my ratings'
          hide: 'Hide my ratings'
          loved: 'Loved'
          hated: 'Hated'
          neutral: 'Neutral or mixed'
          tasteCenter: 'Your taste center'
          averageRating: 'Your average: {{average}} · {{category}}'
          noMappedRatings: 'None of your rated authors are on this map yet'
      compare:
        firstAuthor: 'First author'
        secondAuthor: 'Second author'
        placeholder: 'Start typing an author…'
        clear: 'Clear'
        help: 'Choose two authors to see the evidence in both directions.'
        sameAuthor: 'Pick two different authors.'
        loading: 'Loading the evidence for these two…'
        noResults: 'No authors match that.'
        resultsLabel: 'Author suggestions'
      states:
        validated: 'Validated'
        evidenceThresholdNotMet: 'Does not meet evidence threshold'
        onDemandNotFormallyValidated: 'Does not meet evidence threshold'
        notEnoughData: 'Not enough data'
      stateNotes:
        validated: |-
          This release comparison is validated when it passes all four checks:

          • Benjamini–Hochberg False Discovery Rate q ≤ 0.05
          • A 95% confidence interval excludes zero
          • A ≥5 percentage point difference in liking
          • An empirical-Bayes score >0.25
        evidenceThresholdNotMet: 'Validation requires four checks: q-value, confidence interval, liking difference, and evidence score. One or more checks was not met.'
        onDemandNotFormallyValidated: 'Validation requires four checks: q-value, confidence interval, liking difference, and evidence score. One or more checks was not met.'
        notEnoughData: 'The available observations do not support a usable comparison.'
      # The five directionality classes ship with the release and are authoritative. A missing
      # or weak reverse direction is NOT one of them — that is `unresolved`, which means the
      # evidence did not settle the question either way. The two one-way classes differ only in
      # which name leads, so they share one headline and note.
      status:
        unresolved:
          short: 'Unclear'
          headline: 'Related, but the direction is unclear'
          note: 'These two share readers more than chance explains. Which way it runs is not settled.'
        reciprocal:
          short: 'Both ways'
          headline: 'The relationship runs both ways'
          note: 'Readers of each are more likely to enjoy the other.'
        oneSidedOut:
          short: 'One way →'
        oneSidedIn:
          short: '← One way'
        oneSided:
          headline: '{{leader}} leads to {{follower}}, but not back'
          note: 'Readers of {{leader}} are reliably more likely to enjoy {{follower}}. The reverse effect is too small to matter.'
        opposing:
          short: 'Opposing'
          headline: 'These two pull against each other'
          note: 'Both directions held up with opposite signs: readers who like one tend to be cooler on the other.'
      wording:
        rateQuestion: 'How often did each group like {{target}}?'
        sourceGroup: 'Among {{source}} readers'
        otherGroup: 'Among all other readers'
        notEnoughDataNote: 'The available observations do not support a usable comparison.'
      hover:
        ci: '95% CI'
        pointDifferenceCi: '95% CI for point difference'
        pointDifference: 'Point difference'
        relativeDifference: 'Relative difference'
        readerRate: '{{author}} readers'
        otherReaderRate: 'Other readers'
        zeroBaseline: 'No finite percentage (0% baseline)'
        qValue: 'q-value'
        pValue: 'p-value'
        insufficient: 'Insufficient comparable rating information'
        moreLikely: '{{value}}% more likely'
        lessLikely: '{{value}}% less likely'
        overCap: 'More than 100% more likely'
        sameLikelihood: 'No relative difference'
      table:
        heading: 'Significant relationships'
        author: 'Author'
        outward: 'Liked by {{author}} readers'
        inward: '{{author}} liked by their readers'
        genre: 'Mostly writes'
        about:
          author: 'The other author in this relationship. Select a name to center the map on them.'
          outward: "How much more or less likely this author is to be liked by the selected author's readers than by all other readers."
          inward: "How much more or less likely the selected author is to be liked by this author's readers than by all other readers."
          genre: 'The genre this author publishes in most often.'
        showing: 'Showing {{count}} of {{total}} significant relationships.'
        showingFiltered: 'Showing {{count}} of {{filtered}} matching relationships · {{total}} total.'
        showingAll: 'Showing all {{count}} significant relationships.'
        filterMatches: '{{count}} relationships currently match this filter.'
        noMatches: 'No relationships match that search.'
        searchAuthor: 'Search authors'
        filterGenre: 'Filter by genre'
        allGenres: 'All genres'
        sortBy: 'Sort by {{column}}'
        compareAuthor: 'Compare {{focus}} and {{author}}'
      technical:
        summary: 'Technical details'
        rateDifference: 'Difference in like rate (percentage points)'
        rateDifferenceNote: 'The percentage-point difference between how often readers of one author liked the other and how often all other readers did.'
        ci: '95% confidence interval (percentage points)'
        ciNote: 'Shows how much the estimated difference could vary because of sampling uncertainty; an interval crossing zero means no difference is also plausible.'
        logOddsRatio: 'Log odds ratio (smoothed)'
        logOddsRatioNote: 'Compares the odds of liking in the two groups using the underlying smoothed rating counts.'
        evidenceScore: 'Evidence score'
        evidenceScoreNote: 'The evidence score estimates the smallest effect that is still reasonably supported by the data, after reducing effects that may look large only because the estimate is noisy. A score of 0 means the data do not support a clear effect, while a score above 0.25 means that even a cautious estimate exceeds 0.25 on the log-odds scale.'
        qValueExact: 'q-value'
        qValueNote: 'The q-value estimates the expected share of false discoveries. Lower values are stronger; 0.05 or lower passes validation.'
        pValueExact: 'p-value (unadjusted)'
        pValueNote: 'The p-value measures this on-demand comparison by itself and is not adjusted for all the other author pairs that could have been tested.'
      about:
        heading: 'How to read this'
        space: 'Authors are closer together when they share more readers.'
        communities: 'Groups formed automatically based on reading habits. Genre labels were added afterward to descriptively explain the clustering.'
        provenance: 'Release {{version}} · layout {{map}} · graph {{graph}}'
      errors:
        load: 'Could not load the author data.'
        shard: 'Could not load the relationships for this author.'
        comparison: 'Could not work out the comparison for these two authors.'
        format: 'The relationship data was not in the expected format.'
        retry: 'Try again'
      loading:
        authors: 'Loading authors…'
        connections: 'Loading relationships…'

