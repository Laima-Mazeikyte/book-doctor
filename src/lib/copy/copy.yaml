        within: 'Inside {{community}}'
      browse:
        searchLabel: 'Search authors'
        oneSidedSeeds: 'Authors with one-way relationships'
        landmarks: 'Authors with the most connections'
        noConnections: 'Nothing held up for {{author}} — too few readers here have rated them alongside anyone else.'
        noConnectionsAction: 'Try one of these instead.'
        focusUnmapped: '{{author}} has no position on the map. Their relationships are listed below.'
