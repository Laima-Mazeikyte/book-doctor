<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<!-- Keep font faces available before app CSS. Only shared first-screen faces are
		     preloaded here; FontPreloads.svelte supplies route-specific hints. -->
		<link rel="stylesheet" href="/fonts/bespoke-serif/bespoke-serif.css" />
		<link
			rel="preload"
			href="/fonts/bespoke-serif/fonts/BespokeSerif-Light.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<!-- Inter (interactive UI) + Beth Ellen (display headings): self-hosted like Bespoke,
		     so first paint never depends on a third party. Fallbacks in primitives.css. -->
		<link rel="stylesheet" href="/fonts/inter/inter.css" />
		<link rel="stylesheet" href="/fonts/beth-ellen/beth-ellen.css" />
		<link
			rel="preload"
			href="/fonts/inter/fonts/Inter-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
